name: job-alerts

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 min (GitHub often delays this by 5-15 min)
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan job boards and push new roles to your phone
        run: python scan.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}

      - name: Save what we've already seen
        if: always()
        run: |
          git config user.name "job-alerts"
          git config user.email "job-alerts@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "update seen" && git pull --rebase -q && git push)
