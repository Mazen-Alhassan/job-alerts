name: job-alerts

on:
  schedule:
    - cron: '*/10 * * * *'   # backup timer; cron-job.org triggers it faster (see README)
  workflow_dispatch:         # run by hand, or by cron-job.org every 5 min
    inputs:
      test:
        description: 'Only send a test alert to all channels (no scan)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: job-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan job boards and send new roles to your phone
        run: python scan.py ${{ inputs.test && '--test' || '' }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Save what we've already seen
        if: always()
        run: |
          git config user.name "job-alerts"
          git config user.email "job-alerts@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || (git commit -m "update seen" && git pull --rebase -q && git push)
