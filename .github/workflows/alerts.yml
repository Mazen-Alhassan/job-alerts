name: job-alerts

# One run scans in a loop for ~5.7 hours (a new cycle every ~90s), then starts the next run itself,
# so the scanner is always on. The schedule is only a watchdog that restarts the chain if it ever breaks.
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      test:
        description: 'Only send a test alert to all channels (no scan)'
        type: boolean
        default: false
      minutes:
        description: 'How many minutes this run keeps scanning'
        default: '340'
      sweep_days:
        description: 'Only send a digest of every match posted in the last N days (no scan loop)'
        default: ''

permissions:
  contents: write   # commit seen.json
  actions: write    # start the next run

jobs:
  test:
    if: inputs.test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send a test alert
        run: python3 scan.py --test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  sweep:
    if: inputs.sweep_days != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send a digest of recent matches
        run: python3 scan.py --sweep ${{ inputs.sweep_days }}
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

  gate:
    if: ${{ !inputs.test && !inputs.sweep_days }}
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # a watchdog run only starts a scanner if none is running or waiting
          go=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh api "repos/${{ github.repository }}/actions/workflows/alerts.yml/runs?per_page=30" \
              --jq '[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status != "completed")] | length')
            [ "$n" -gt 0 ] && go=false
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"

  scan:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: job-alerts
      cancel-in-progress: false
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Scan job boards and send new roles to your phone
        run: |
          git config user.name "job-alerts"
          git config user.email "job-alerts@users.noreply.github.com"
          python scan.py --loop ${{ inputs.minutes || '340' }} --commit

      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run alerts.yml --ref main -R ${{ github.repository }}
